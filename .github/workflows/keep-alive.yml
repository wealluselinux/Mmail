# Render's free plan puts a service to sleep after about 15 minutes without traffic.
# This pings the site every 5 minutes so it stays awake.
#
# To use a different address, add a repository variable named SITE_URL under
# Settings > Secrets and variables > Actions > Variables.
name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://mmail.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "$SITE_URL/api/health"
